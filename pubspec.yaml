name: zlux_pos
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  image_picker: ^1.1.2

  # Local/offline database (source of truth for offline-first POS)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Routing
  go_router: ^14.6.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  print_bluetooth_thermal: ^1.1.7
  esc_pos_utils_plus: ^2.0.4

  # Permissions (bluetooth/location on Android)
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.3


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.21.0
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.13.1
  


flutter:


  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_white_zlux.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/adaptive_icon_zlux.png"